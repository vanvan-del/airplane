<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!-- @artifact-start -->
<title>排版工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 布局：顶栏 + 左侧素材库 + 中间画布 + 右侧图层，画布占据最大面积；窄屏时面板收到画布下方 */
  :root {
    --bg: #E6E8EC;
    --panel: #F7F8FA;
    --panel-2: #EEF0F3;
    --fg: #1B1F27;
    --muted: #677080;
    --line: #D3D8E0;
    --accent: #2557D6;
    --accent-soft: rgba(37, 87, 214, 0.12);
    --danger: #C8352E;
    --checker-a: #FFFFFF;
    --checker-b: #E3E6EB;
    --page: #FFFFFF;
    --shadow: 0 1px 2px rgba(20, 24, 33, 0.08), 0 8px 24px rgba(20, 24, 33, 0.10);
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191E; --panel: #21242B; --panel-2: #2A2E36; --fg: #E6E8EC; --muted: #9AA2B1; --line: #343944;
      --accent: #7A9DFF; --accent-soft: rgba(122, 157, 255, 0.16); --danger: #FF6B5E;
      --checker-a: #2A2E36; --checker-b: #23262D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191E; --panel: #21242B; --panel-2: #2A2E36; --fg: #E6E8EC; --muted: #9AA2B1; --line: #343944;
    --accent: #7A9DFF; --accent-soft: rgba(122, 157, 255, 0.16); --danger: #FF6B5E;
    --checker-a: #2A2E36; --checker-b: #23262D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr) 248px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top top" "assets stage layers";
  }

  /* 顶栏 */
  .top {
    grid-area: top;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding-block: 8px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .02em; margin-right: 4px; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow-x: auto; flex: 1 1 240px; scrollbar-width: thin; }
  .tab {
    display: flex; align-items: center; gap: 4px; flex: none;
    border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; background: transparent; white-space: nowrap;
  }
  .tab:hover { background: var(--panel-2); }
  .tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab input { width: 110px; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; background: var(--panel); }
  .tab-add { flex: none; border: 1px dashed var(--line); border-radius: 6px; padding: 5px 10px; background: transparent; color: var(--muted); }
  .tab-add:hover { color: var(--fg); border-color: var(--muted); }
  .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }
  .sep { width: 1px; height: 20px; background: var(--line); }
  select.btn { padding-right: 6px; }
  .status { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status.warn { color: var(--danger); }

  /* 侧栏 */
  .side { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .assets { grid-area: assets; border-right: 1px solid var(--line); }
  .layers { grid-area: layers; border-left: 1px solid var(--line); }
  .side-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .side-head h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .side-body { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; padding: 4px 2px; }

  .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .asset {
    position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px;
    background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 12px 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .asset:hover { border-color: var(--accent); }
  .asset img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
  .asset .name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 6px; font-size: 11px; text-align: left;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 7px 7px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .asset .x {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: 12px; line-height: 1; display: none; padding: 0;
  }
  .asset:hover .x, .asset:focus-within .x { display: block; }
  .asset .x:hover { color: var(--danger); border-color: var(--danger); }
  .confirm {
    grid-column: 1 / -1; border: 1px solid var(--danger); border-radius: 8px; padding: 8px; font-size: 12px; line-height: 1.5;
    display: flex; flex-direction: column; gap: 6px; background: var(--panel-2);
  }
  .confirm .row { display: flex; gap: 6px; }
  .drop-tip { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }

  /* 图层列表 */
  .layer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .layer {
    display: grid; grid-template-columns: 14px 32px minmax(0, 1fr) auto; align-items: center; gap: 6px;
    padding: 4px 6px; border-radius: 6px; border: 1px solid transparent; user-select: none; background: var(--panel);
  }
  .layer:hover { background: var(--panel-2); }
  .layer.on { background: var(--accent-soft); border-color: var(--accent); }
  .layer.hidden .lname, .layer.hidden .lthumb { opacity: .4; }
  .layer.dragging { opacity: .5; }
  .layer.drop-before { box-shadow: 0 -2px 0 var(--accent); }
  .layer.drop-after { box-shadow: 0 2px 0 var(--accent); }
  .grip { cursor: grab; color: var(--muted); font-size: 12px; text-align: center; touch-action: none; }
  .lthumb {
    width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--line); object-fit: contain;
    background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 8px 8px;
  }
  .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbtns { display: flex; gap: 2px; }
  .ib {
    width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ib:hover { background: var(--panel-2); color: var(--fg); }
  .ib.active { color: var(--accent); }
  .ib.del:hover { color: var(--danger); }
  .ib svg { width: 15px; height: 15px; }

  /* 画布 */
  .stage-wrap {
    grid-area: stage; position: relative; overflow: hidden; touch-action: none;
    background: var(--bg);
  }
  .page {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--page); box-shadow: var(--shadow); overflow: hidden;
  }
  .page img { position: absolute; left: 0; top: 0; transform-origin: center center; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .overlay .box { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .overlay .box.locked { stroke-dasharray: 4 3; }
  .overlay .handle { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; pointer-events: all; cursor: nwse-resize; }
  .overlay .rot { cursor: grab; }
  .overlay .stem { stroke: var(--accent); stroke-width: 1.5; }
  .page-label {
    position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .empty-cta {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
  }
  .empty-cta p { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; color: var(--muted); box-shadow: var(--shadow); }
  .dropzone { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--accent); pointer-events: none; }

  /* 预览 */
  .preview {
    position: fixed; inset: 0; z-index: 50; background: #0E0F12; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .preview-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #C9CED8;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .preview-bar .btn { background: #22252C; border-color: #3A3F4A; color: #E6E8EC; }
  .preview-stage { flex: 1; position: relative; min-height: 0; }
  .preview-stage canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 32px); max-height: calc(100% - 32px); box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #fff; }

  /* 提示条 */
  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
    background: var(--fg); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow);
    max-width: calc(100% - 32px);
  }
  .sheet {
    position: fixed; inset: 0; z-index: 55; background: rgba(10, 12, 16, .45); display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .sheet-card { background: var(--panel); border-radius: 12px; padding: 18px; max-width: 380px; width: 100%; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
  .sheet-card h3 { margin: 0; font-size: 15px; text-wrap: balance; }
  .sheet-card p { margin: 0; color: var(--muted); line-height: 1.6; }
  .sheet-card .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .mobile-tabs { display: none; }

  @media (max-width: 760px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto 38vh;
      grid-template-areas: "top" "stage" "mtabs" "panel";
    }
    .assets, .layers { grid-area: panel; border: 0; border-top: 1px solid var(--line); }
    .app[data-panel="assets"] .layers, .app[data-panel="layers"] .assets { display: none; }
    .mobile-tabs { grid-area: mtabs; display: flex; gap: 4px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); }
    .mobile-tabs .tab { flex: 1; justify-content: center; }
    .asset-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
    .brand { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tab, .btn, .layer, .asset { transition: background-color .12s, border-color .12s; }
  }
</style>

<div class="app" id="app" data-panel="assets">
  <header class="top">
    <span class="brand">排版工作台</span>
    <nav class="tabs" id="tabs" aria-label="页面"></nav>
    <div class="tools">
      <select class="btn" id="sizeSel" title="画布尺寸" aria-label="画布尺寸">
        <option value="1920x1080">横版 16:9</option>
        <option value="1080x1920">竖版 9:16</option>
        <option value="1080x1080">方形 1:1</option>
        <option value="1600x1200">横版 4:3</option>
        <option value="1240x1754">A4 竖版</option>
      </select>
      <span class="sep"></span>
      <button class="btn" id="undoBtn" title="撤销（Ctrl+Z）">撤销</button>
      <button class="btn" id="redoBtn" title="重做（Ctrl+Shift+Z）">重做</button>
      <span class="sep"></span>
      <button class="btn" id="previewBtn">预览</button>
      <button class="btn" id="importBtn">导入</button>
      <button class="btn" id="exportBtn">导出</button>
      <span class="status" id="status">读取中…</span>
    </div>
  </header>

  <aside class="side assets" aria-label="素材库">
    <div class="side-head">
      <h2>素材库 · 所有页面共用</h2>
      <button class="btn primary" id="uploadBtn">上传</button>
    </div>
    <div class="side-body">
      <div class="asset-grid" id="assetGrid"></div>
      <div class="drop-tip">点素材放到画布上<br>也可以把图片直接拖进窗口或粘贴</div>
    </div>
  </aside>

  <main class="stage-wrap" id="stageWrap" aria-label="画布">
    <div class="page" id="page"></div>
    <svg class="overlay" id="overlay"></svg>
    <div class="empty-cta" id="emptyCta" hidden><p>从素材库点一张图片，放到这一页上</p></div>
    <div class="page-label" id="pageLabel"></div>
    <div class="dropzone" id="dropzone" hidden>松开鼠标，把图片加入素材库</div>
  </main>

  <div class="mobile-tabs" role="tablist">
    <button class="tab on" data-mpanel="assets">素材库</button>
    <button class="tab" data-mpanel="layers">图层</button>
  </div>

  <aside class="side layers" aria-label="图层">
    <div class="side-head">
      <h2>图层 · 上面的在最前</h2>
    </div>
    <div class="side-body">
      <ul class="layer-list" id="layerList"></ul>
      <p class="hint" id="layerHint">拖动左边的 ⋮⋮ 调整前后顺序。<br>Delete 删除，方向键微调，Shift 旋转按 15° 吸附。</p>
    </div>
  </aside>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<div class="preview" id="preview" hidden>
  <div class="preview-bar">
    <button class="btn" id="prevPage">‹ 上一页</button>
    <span id="previewTitle"></span>
    <div class="tools">
      <button class="btn" id="nextPage">下一页 ›</button>
      <button class="btn" id="closePreview">关闭（Esc）</button>
    </div>
  </div>
  <div class="preview-stage"><canvas id="previewCanvas"></canvas></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <h3 id="sheetTitle"></h3>
    <p id="sheetText"></p>
    <div class="row">
      <button class="btn" id="sheetCancel">取消</button>
      <button class="btn primary" id="sheetOk">确定</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  'use strict';

  // ---------- 小工具 ----------
  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const DEG = Math.PI / 180;
  const WINDOW_ID = uid();
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2400);
  }
  // 页面内的确认框（浏览器自带的 confirm 在一些环境里不能用）
  function ask(title, text, okText = '确定', danger = false) {
    return new Promise((resolve) => {
      $('sheetTitle').textContent = title; $('sheetText').textContent = text;
      const ok = $('sheetOk'); ok.textContent = okText; ok.classList.toggle('danger', danger);
      ok.classList.toggle('primary', !danger);
      $('sheet').hidden = false; ok.focus();
      const done = (v) => { $('sheet').hidden = true; ok.onclick = $('sheetCancel').onclick = null; resolve(v); };
      ok.onclick = () => done(true); $('sheetCancel').onclick = () => done(false);
    });
  }

  // ---------- 存储：IndexedDB 存项目和图片，不可用时退回内存 ----------
  const store = (() => {
    let dbp = null;
    try {
      dbp = new Promise((resolve, reject) => {
        const req = indexedDB.open('layout-editor', 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('kv'); req.result.createObjectStore('assets'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    } catch (e) { dbp = Promise.reject(e); }
    const mem = { kv: new Map(), assets: new Map() };
    let ok = true;
    dbp.catch(() => { ok = false; });
    async function tx(name, mode, fn) {
      try {
        const db = await dbp;
        return await new Promise((resolve, reject) => {
          const t = db.transaction(name, mode); const s = t.objectStore(name);
          const r = fn(s);
          t.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
          t.onerror = () => reject(t.error);
        });
      } catch {
        ok = false;
        return fn(null, mem[name]);
      }
    }
    return {
      get ok() { return ok; },
      get: (name, key) => tx(name, 'readonly', (s, m) => (s ? s.get(key) : { result: m.get(key) })),
      put: (name, key, val) => tx(name, 'readwrite', (s, m) => (s ? s.put(val, key) : m.set(key, val))),
      del: (name, key) => tx(name, 'readwrite', (s, m) => (s ? s.delete(key) : m.delete(key))),
      keys: (name) => tx(name, 'readonly', (s, m) => (s ? s.getAllKeys() : { result: [...m.keys()] })),
    };
  })();

  // ---------- 状态 ----------
  // project: { rev, savedBy, assets:[{id,name,w,h}], pages:[{id,name,w,h,layers:[{id,assetId,name,x,y,scale,rot,hidden,locked}]}], currentPageId }
  let project = null;
  let selectedId = null;
  const urls = new Map();     // 素材 id → objectURL
  const alphas = new Map();   // 素材 id → {w,h,data} 用于按透明度点选
  const history = new Map();  // 页面 id → {past:[], future:[]}

  const page = () => project.pages.find((p) => p.id === project.currentPageId) || project.pages[0];
  const assetOf = (id) => project.assets.find((a) => a.id === id);
  const layerOf = (id) => page().layers.find((l) => l.id === id);
  const hist = () => {
    const id = page().id;
    if (!history.has(id)) history.set(id, { past: [], future: [] });
    return history.get(id);
  };
  function remember() {
    const h = hist();
    h.past.push(JSON.stringify(page().layers));
    if (h.past.length > 150) h.past.shift();
    h.future = [];
  }
  function undo() {
    const h = hist(); if (!h.past.length) return;
    h.future.push(JSON.stringify(page().layers));
    page().layers = JSON.parse(h.past.pop());
    if (!layerOf(selectedId)) selectedId = null;
    changed();
  }
  function redo() {
    const h = hist(); if (!h.future.length) return;
    h.past.push(JSON.stringify(page().layers));
    page().layers = JSON.parse(h.future.pop());
    if (!layerOf(selectedId)) selectedId = null;
    changed();
  }

  // ---------- 保存与多窗口同步 ----------
  const channel = 'BroadcastChannel' in window ? new BroadcastChannel('layout-editor') : null;
  let saveTimer = 0;
  let saving = Promise.resolve();
  function setStatus(text, warn) { const s = $('status'); s.textContent = text; s.classList.toggle('warn', !!warn); }
  function scheduleSave() {
    setStatus('保存中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 300);
  }
  function save() {
    saving = saving.then(async () => {
      // 以库里最新的版本号为准往上加，多个窗口交替保存时不会倒退
      const stored = await store.get('kv', 'project').catch(() => null);
      project.rev = Math.max(project.rev || 0, stored?.rev || 0) + 1;
      project.savedBy = WINDOW_ID;
      await store.put('kv', 'project', clone(project));
      try { channel?.postMessage({ type: 'saved', rev: project.rev, from: WINDOW_ID }); } catch {}

  // ---------- 图层拖动排序 ----------
  function startReorder(e, li, id) {

  let previewIndex = 0;
  async function drawPage(p, canvas) {
    canvas.width = p.w; canvas.height = p.h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, p.w, p.h);
    for (const l of p.layers) {
      const a = assetOf(l.assetId); if (!a || l.hidden || !urls.get(a.id)) continue;
      const img = await readImage(urls.get(a.id));
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot * DEG); ctx.scale(l.scale, l.scale);
      ctx.drawImage(img, -a.w / 2, -a.h / 2, a.w, a.h); ctx.restore();
    }
  }
  async function showPreview(i) {
    previewIndex = (i + project.pages.length) % project.pages.length;
    const p = project.pages[previewIndex];
    $('previewTitle').textContent = p.name + '（' + (previewIndex + 1) + ' / ' + project.pages.length + '）';
    $('preview').hidden = false;
    await drawPage(p, $('previewCanvas'));
  }
  $('previewBtn').onclick = () => showPreview(project.pages.indexOf(page()));
  $('prevPage').onclick = () => showPreview(previewIndex - 1);
  $('nextPage').onclick = () => showPreview(previewIndex + 1);
  $('closePreview').onclick = () => ($('preview').hidden = true);

  // ---------- 导入导出 ----------
  const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
  async function exportProject() {
    setStatus('正在打包…');
    const images = {};
    for (const a of project.assets) {
      const b = await store.get('assets', a.id);
      if (b) images[a.id] = await blobToDataUrl(b);
    }
    const data = JSON.stringify({ app: 'layout-editor', version: 1, exportedAt: new Date().toISOString(), project: clone(project), images });
    const d = new Date();
    const filename = 'layout-project-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
    const blob = new Blob([data], { type: 'application/json' });
    // 在 Claude 里打开时用它提供的保存功能，其他地方直接下载
    const inClaude = !!window.claude?.use;
    const dl = inClaude ? await window.claude.use('downloads').catch(() => null) : null;
    if (inClaude && !dl) {
      toast('这里不能保存文件，请用本地启动的编辑器导出');
    } else if (dl) {
      try { await dl.save({ filename, data: blob }); toast('已导出 ' + filename); }
      catch (err) { if (err?.code !== 'declined') toast('这里不能保存文件，请在本地打开编辑器导出'); }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('已导出 ' + filename);
    }
    scheduleSave();
  }
  async function importProject(file) {
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch { toast('文件不是有效的项目 JSON'); return; }
    if (parsed?.app !== 'layout-editor' || !parsed.project?.pages?.length) { toast('这不是排版工作台导出的项目文件'); return; }
    const ok = await ask('导入项目？', '会用「' + file.name + '」替换当前的全部页面和素材。建议先导出备份当前项目。', '替换并导入', true);
    if (!ok) return;
    const oldIds = await store.keys('assets');
    for (const id of oldIds) await store.del('assets', id);
    urls.forEach((u) => URL.revokeObjectURL(u)); urls.clear(); alphas.clear(); history.clear();
    for (const [id, dataUrl] of Object.entries(parsed.images || {})) {
      const blob = await (await fetch(dataUrl)).blob();
      await store.put('assets', id, blob);
    }
    const rev = project.rev || 0;
    project = parsed.project;
    project.rev = Math.max(rev, project.rev || 0);
    if (!project.pages.some((p) => p.id === project.currentPageId)) project.currentPageId = project.pages[0].id;
    selectedId = null;
    await loadAssetUrls();
    changed();
    toast('已导入 ' + project.pages.length + ' 个页面、' + project.assets.length + ' 个素材');
  }
  $('exportBtn').onclick = exportProject;
  $('importBtn').onclick = () => $('importInput').click();
  $('importInput').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importProject(f); };
  $('uploadBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  $('undoBtn').onclick = undo;
  $('redoBtn').onclick = redo;
  document.querySelectorAll('[data-mpanel]').forEach((b) => (b.onclick = () => {
    $('app').dataset.panel = b.dataset.mpanel;
    document.querySelectorAll('[data-mpanel]').forEach((x) => x.classList.toggle('on', x === b));
  }));

  // 拖入或粘贴图片
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('dropzone').hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropzone').hidden = true; });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('dropzone').hidden = true;
    const files = [...(e.dataTransfer?.files || [])];
    const json = files.find((f) => f.name.endsWith('.json'));
    if (json) importProject(json); else addFiles(files);
  });
  window.addEventListener('paste', (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) addFiles(files);
  });

  // 快捷键
  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select, textarea')) return;
    if (!$('preview').hidden) {
      if (e.key === 'Escape') $('preview').hidden = true;
      if (e.key === 'ArrowLeft') showPreview(previewIndex - 1);
      if (e.key === 'ArrowRight') showPreview(previewIndex + 1);
      return;
    }
    if (!$('sheet').hidden) { if (e.key === 'Escape') $('sheetCancel').click(); return; }
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    const l = layerOf(selectedId);
    if (e.key === 'Escape') { selectedId = null; render(); return; }
    if (!l) return;
    if ((e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); removeLayer(l.id); return; }
    const step = e.shiftKey ? 10 : 1;
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (d && !l.locked) { e.preventDefault(); remember(); l.x += d[0]; l.y += d[1]; changed(); }
  });

  // ---------- 示例素材：第一次打开时画几张透明图片 ----------
  function sampleCanvas(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'));
    return new Promise((res) => c.toBlob(res, 'image/png'));
  }
  async function seed() {
    const samples = [
      ['示例-太阳', 360, 360, (g) => {
        g.fillStyle = '#FFC93C';
        for (let i = 0; i < 12; i++) { g.save(); g.translate(180, 180); g.rotate(i * Math.PI / 6); g.beginPath(); g.moveTo(-14, -120); g.lineTo(0, -170); g.lineTo(14, -120); g.fill(); g.restore(); }
        g.beginPath(); g.arc(180, 180, 100, 0, Math.PI * 2); g.fill();
      }],
      ['示例-云朵', 520, 300, (g) => {
        g.fillStyle = '#FFFFFF'; g.strokeStyle = '#B9D6EE'; g.lineWidth = 8;
        g.beginPath(); g.arc(150, 190, 80, Math.PI * 0.5, Math.PI * 1.5); g.arc(250, 120, 100, Math.PI, 0); g.arc(380, 180, 90, Math.PI * 1.4, Math.PI * 0.5); g.closePath(); g.fill(); g.stroke();
      }],
      ['示例-纸飞机', 480, 320, (g) => {
        g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = '#1D3557';
        g.fillStyle = '#FF7A59'; g.beginPath(); g.moveTo(20, 150); g.lineTo(460, 20); g.lineTo(200, 200); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = '#E25B3B'; g.beginPath(); g.moveTo(200, 200); g.lineTo(460, 20); g.lineTo(250, 300); g.closePath(); g.fill(); g.stroke();
      }],
    ];
    const assets = [];
    for (const [name, w, h, draw] of samples) {
      const blob = await sampleCanvas(w, h, draw);
      const id = uid();
      await store.put('assets', id, blob);
      assets.push({ id, name, w, h });
    }
    const pid = uid();
    project = {
      rev: 0, assets, currentPageId: pid,
      pages: [{
        id: pid, name: '封面（示例）', w: 1920, h: 1080, layers: [
          { id: uid(), assetId: assets[1].id, name: '示例-云朵', x: 560, y: 330, scale: 1, rot: 0, hidden: false, locked: false },
          { id: uid(), assetId: assets[0].id, name: '示例-太阳', x: 1500, y: 260, scale: 0.9, rot: 0, hidden: false, locked: false },
          { id: uid(), assetId: assets[2].id, name: '示例-纸飞机', x: 1040, y: 640, scale: 1.1, rot: -12, hidden: false, locked: false },
        ],
      }],
    };
  }

  // ---------- 启动 ----------
  (async () => {
    try { project = await store.get('kv', 'project'); } catch { project = null; }
    if (!project?.pages?.length) { await seed(); await save(); }
    await loadAssetUrls();
    render();
    if (store.ok) setStatus('已自动保存'); else setStatus('此环境不能自动保存，请记得导出', true);
  })();
})();
</script>
<!-- @artifact-end -->
